name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published vX.Y.Z tag to deploy; leave blank for a non-mutating SSH check
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.release_tag != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.release_tag != ''
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
        if: inputs.release_tag != ''
      - run: npm audit --audit-level=low
        if: inputs.release_tag != ''
      - run: npm run check
        if: inputs.release_tag != ''

      - name: Connect to production tailnet for master probe
        if: inputs.release_tag == ''
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_MASTER_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_MASTER_AUDIENCE }}
          tags: tag:ci-deploy

      - name: Connect to production tailnet for release
        if: inputs.release_tag != ''
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_TAG_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_TAG_AUDIENCE }}
          tags: tag:ci-deploy

      - name: Verify SSH host and configure key
        env:
          NOTES_DEPLOY_KEY: ${{ secrets.NOTES_DEPLOY_KEY }}
          NOTES_DEPLOY_HOST: ${{ vars.NOTES_DEPLOY_HOST }}
          TS_SSH_HOST_FINGERPRINT: ${{ secrets.TS_SSH_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$NOTES_DEPLOY_KEY"
          test -n "$NOTES_DEPLOY_HOST"
          test -n "$TS_SSH_HOST_FINGERPRINT"
          printf '%s\n' "$NOTES_DEPLOY_KEY" > "$RUNNER_TEMP/notes-deploy-key"
          ssh-keyscan -T 10 -t ecdsa "$NOTES_DEPLOY_HOST" > "$RUNNER_TEMP/notes-known-hosts"
          if ! ssh-keygen -lf "$RUNNER_TEMP/notes-known-hosts" -E sha256 \
            | awk -v expected="$TS_SSH_HOST_FINGERPRINT" '$2 == expected { found = 1 } END { exit !found }'; then
            echo "OCI SSH host key fingerprint did not match the pinned value." >&2
            exit 1
          fi

      - name: Verify restricted SSH access without deployment
        if: inputs.release_tag == ''
        env:
          NOTES_DEPLOY_HOST: ${{ vars.NOTES_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/notes-ssh-probe-output"
          set +e
          printf 'invalid-probe\n%s\n' "$GITHUB_SHA" \
            | ssh -T -i "$RUNNER_TEMP/notes-deploy-key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/notes-known-hosts" \
              -o ConnectTimeout=10 \
              "notes-deploy@$NOTES_DEPLOY_HOST" >"$output" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 2 ]] || ! grep -Fq 'invalid release tag' "$output"; then
            sed -n '1,80p' "$output" >&2
            echo "Restricted SSH probe did not reach the non-mutating Notes deploy guard." >&2
            exit 1
          fi
          echo "Restricted SSH authentication and forced-command guard verified; no deployment ran."

      - name: Validate release tag and resolve commit
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          printf 'RELEASE_SHA=%s\n' "$release_sha" >> "$GITHUB_ENV"

      - name: Deploy release tag
        if: inputs.release_tag != ''
        env:
          NOTES_DEPLOY_HOST: ${{ vars.NOTES_DEPLOY_HOST }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          printf '%s\n%s\n' "$RELEASE_TAG" "$RELEASE_SHA" \
            | ssh -T -i "$RUNNER_TEMP/notes-deploy-key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/notes-known-hosts" \
              -o ConnectTimeout=10 \
              "notes-deploy@$NOTES_DEPLOY_HOST"

      - name: Verify public Notes endpoint
        if: inputs.release_tag != ''
        run: curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-max-time 90 --max-time 20 https://notes.cdir.io/ -o /dev/null
