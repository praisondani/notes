services:
  notes:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: 3000
    ports:
      - "${NOTES_PORT:-3000}:3000"
    volumes:
      - notes-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  notes-data:
